<div class="container">
  <div class="search-container">
    <label for="title">Title</label>
    <input
      type="text"
      #movieTitle
      id="title"
      placeholder="e.g : Dexter"
      (input)="getMovieByTitle(movieTitle.value)"
    />

    <fa-icon [icon]="faMagnifyingGlass" />
  </div>
</div>
